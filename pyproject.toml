[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "path-nd-uploader"
version = "0.1.0"
description = "Validates and uploads pathology whole-slide images and CDE-schema metadata to Google Cloud Storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-cloud-storage>=2.16",
    "google-crc32c>=1.5",
    "openpyxl>=3.1",
    "openslide-python>=1.3",
    "openslide-bin>=4.0",
    "tifffile>=2024.5",
    "typer>=0.12",
    "tenacity>=8.2",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[project.scripts]
path-nd-uploader = "pathnd_uploader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pathnd_uploader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises a real sample slide file, not run by default",
]
addopts = "-m 'not slow'"
